# variants.yaml — the variant apparatus, as facts
#
# One entry per meaning-bearing divergence between our base text (the Wang Bi
# received recension) and the older witnesses. Read by:
#
#   python3 tools/concordance.py --witnesses 21
#   python3 tools/check_locks.py --rule unlogged-variant
#
# WHY FACTS AND NOT TRANSCRIPTIONS. The Mawangdui silks were excavated in 1973
# and the Guodian slips in 1993. Every transcription of them is modern, and
# reconstructing the damaged graphs is genuine editorial work by living
# scholars. "Mawangdui A and B read 自今及古 where Wang Bi reads 自古及今" is a
# fact about a text, and facts are not copyrightable. See PROVENANCE.md.
#
# Witness ids: wangbi (our base) · mawangdui-a (甲本, c. 200 BCE) ·
# mawangdui-b (乙本, c. 175 BCE) · guodian (~300 BCE) · beida (early Han) ·
# fuyi (Tang) · heshanggong · hanfeizi (解老 / 喻老, oldest commentary)
#
# Fields:
#   chapter          int
#   line             the base-text line the fork sits in
#   base             our reading (the contested characters only)
#   witnesses        {witness-id: reading}
#   meaning_bearing  true when the fork changes what the line says
#   our_call         base | <witness-id> | punctuation | undecided
#   note             one sentence on what turns on it
#   logged           where the reasoning lives, or false

- chapter: 21
  line: "道之為物，惟恍惟惚"
  base: "道之為物"
  witnesses: { mawangdui-a: "道之物", mawangdui-b: "道之物" }
  meaning_bearing: false
  our_call: base
  note: >
    The silks drop 為, leaving 之 as a plain possessive — "the Tao's thingness"
    rather than "the Tao's being a thing." Both point at the same sense, so the
    reading is not in doubt; only the English is. Logged because it settles that
    the topic of the line is what the Tao amounts to as an entity.
  logged: notes/manuscript.md

- chapter: 21
  line: "自古及今，其名不去"
  base: "自古及今"
  witnesses: { mawangdui-a: "自今及古", mawangdui-b: "自今及古" }
  meaning_bearing: true
  our_call: base
  note: >
    Reverses the direction of the inquiry. Mawangdui makes the chapter start
    from the present and trace backward; Wang Bi makes it arrive at the
    present. We render the arrival, which is the movement of the chapter.
  logged: notes/manuscript.md

- chapter: 21
  line: "以閱眾甫"
  base: "閱"
  witnesses: { mawangdui-a: "順", mawangdui-b: "順" }
  meaning_bearing: true
  our_call: base
  note: >
    閱 is to observe; 順 is to follow along with. The chapter closes on a
    knowledge question (吾何以知), which the epistemic verb fits.
  logged: notes/manuscript.md

- chapter: 21
  line: "以閱眾甫"
  base: "甫"
  witnesses: { mawangdui-a: "父", mawangdui-b: "父" }
  meaning_bearing: false
  our_call: base
  note: >
    No decision needed. Ch 42 already settled that 父 here means origin or
    root, not father in the personal sense, so both give "origin" in English.
  logged: notes/manuscript.md

- chapter: 21
  line: "吾何以知眾甫之狀哉"
  base: "狀"
  witnesses: { mawangdui-a: "然", mawangdui-b: "然", heshanggong: "然", siku-wangbi: "狀 〔案狀各本俱作然〕" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    RESOLVED 2026-08-11 — we follow 然. Five arguments converge, and only the
    last four are about manuscripts. 狀 (zhuàng, shape) occurs twice in the
    whole book; 然 (rán, so) occurs twelve times, and 吾何以知…然哉？以此 is a
    FIXED CLOSING FORMULA that Ch 54 and Ch 57 both use — 然 completes it and
    狀 breaks it. Then: both Mawangdui silks read 然, the Song Heshang Gong
    edition reads 然, and the Siku compilers' own note on this line reads
    〔案狀各本俱作然〕, "for 狀, all editions read 然". Rendered "How do I know
    the origin of the many is so?", which lets a reader hear the formula in all
    three chapters. The base text and Source table keep 狀; only the
    translation follows the witnesses, as at Ch 41, 42, 47 and 53.
  logged: notes/manuscript.md

- chapter: 25
  line: "故道大，天大，地大，王亦大"
  base: "王"
  witnesses: { mawangdui-a: "人", mawangdui-b: "人" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    King or human among the four greats. Both silks read 人, and the older silk
    reads 人 in the following line too, so it has no king in the passage at all.
    The received text then contradicts itself with 人法地. See DISCOVERIES.md §1.
  logged: notes/manuscript.md

- chapter: 25
  line: "域中有四大，而王居其一焉"
  base: "王"
  witnesses: { mawangdui-a: "人", mawangdui-b: "王" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Silk B is caught mid-drift: 人 in the list of four, 王 here. The throne can
    be watched arriving between the two silks.
  logged: notes/manuscript.md

- chapter: 25
  line: "域中有四大"
  base: "域"
  witnesses: { mawangdui-a: "國", mawangdui-b: "國" }
  meaning_bearing: false
  our_call: base
  note: >
    域 is a bounded domain, 國 a state. Both are spatial and "within the realm"
    serves either, so this is logged rather than decided.
  logged: notes/manuscript.md

- chapter: 25
  line: "有物混成"
  base: "混"
  witnesses: { mawangdui-a: "昆", mawangdui-b: "昆" }
  meaning_bearing: false
  our_call: base
  note: "Graphic variant only; both read as merged, undifferentiated."
  logged: notes/manuscript.md

- chapter: 2
  line: "長短相形，高下相盈"
  base: "相形 … 相盈"
  witnesses: { siku-wangbi: "相較 … 相傾" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku Quanshu printing of Wang Bi reads 長短相較，髙下相傾. Our base text
    reads 形 and 盈, which are the Mawangdui readings — so our "Wang Bi base
    text" already carries non-Wang-Bi readings at this line. Worth knowing about
    the base text generally, not just here.
  logged: notes/manuscript.md

- chapter: 9
  line: "揣而銳之，不可長保"
  base: "銳"
  witnesses: { siku-wangbi: "梲" }
  meaning_bearing: true
  our_call: base
  note: >
    梲 is a roof-beam or a mallet-head; 銳 is a sharpened point. "Hammer it to a
    point" against "hammer it into a beam." We keep 銳, which the whole line's
    sense of over-sharpening requires.
  logged: notes/manuscript.md

- chapter: 26
  line: "君子終日行不離輜重"
  base: "君子"
  witnesses: { siku-wangbi: "聖人", heshanggong: "聖人" }
  meaning_bearing: true
  our_call: base
  note: >
    Our base reads 君子 (the gentleman — a Confucian term); BOTH the Siku Wang Bi
    and the Song Heshang Gong read 聖人 (the sage), and the Siku reads 主 where we
    read 王 later in the chapter. Two independent editions against our reading.
    Directly relevant to the thread on reading past the throne, since it shows
    the two vocabularies competing inside one recension. See DISCOVERIES.md §1.
  logged: notes/manuscript.md

- chapter: 55
  line: "未知牝牡之合而朘作"
  base: "朘"
  witnesses: { siku-wangbi: "全", mawangdui-a: "朘", fuyi: "朘" }
  meaning_bearing: true
  our_call: base
  note: >
    Correcting our own record. The manuscript note long claimed our base text
    read 全 and that we were keeping it; our source table in fact reads 朘, the
    Mawangdui and Fu Yi reading, while the verse renders 全 ("their whole being
    quickens"). The received Wang Bi reading is 全, as the Siku printing shows.
    So the verse follows 全 and the source table shows 朘. Found by the
    commentary import, 2026-08-11.
  logged: notes/manuscript.md

- chapter: 32
  line: "道常無名。樸雖小"
  base: "道常無名。樸雖小"
  witnesses: {}
  meaning_bearing: true
  our_call: punctuation
  note: >
    A punctuation fork, not a textual one, and the Chinese carries no
    punctuation at all. Received breaks after 無名, making 樸 the subject that
    is small. We read 無名樸 as one attribute of the Tao, making the Tao what
    is small.
  logged: notes/manuscript.md

- chapter: 41
  line: "大器晚成"
  base: "晚成"
  witnesses: { mawangdui-a: "免成", guodian: "曼成" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Completed late, against never completed. We follow the witnesses because it
    completes the parallel with 無隅 / 希聲 / 無形, each "the great X lacks its
    defining mark."
  logged: notes/manuscript.md

- chapter: 42
  line: "吾將以為教父"
  base: "教父"
  witnesses: { mawangdui-a: "學父" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Father of teaching, against father of learning. We follow the silk — the
    bolder reading and the older one. 父 means origin or root here.
  logged: notes/manuscript.md

- chapter: 46
  line: "禍莫大於不知足"
  base: "(two calamity clauses)"
  witnesses: { mawangdui-a: "罪莫大於可欲 (a third, prior clause)", fuyi: "罪莫大於可欲" }
  meaning_bearing: true
  our_call: base
  note: >
    The older witnesses remember a rising three-beat — crime/desire,
    disaster/discontent, fault/greed — that the received text trimmed to two.
    We keep the received pair and note the fuller crescendo.
  logged: notes/manuscript.md

- chapter: 47
  line: "不見而名"
  base: "名"
  witnesses: { mawangdui-a: "明" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    The homophone pair, both míng. We follow 明 (clear-seeing): it completes the
    parallel of know / see-clearly / accomplish, each without its usual means.
  logged: notes/manuscript.md

- chapter: 51
  line: "長之育之，亭之毒之"
  base: "亭之毒之"
  witnesses: { heshanggong: "成之熟之" }
  meaning_bearing: true
  our_call: base
  note: >
    亭/毒 are obscure here and have long puzzled readers; Heshang Gong's edition
    reads 成之熟之 ("completes them, ripens them"), which is plainer and may be
    an early clarification of a hard reading rather than a witness to a different
    original. Logged for the Ch 51 sweep.
  logged: notes/manuscript.md

- chapter: 53
  line: "是謂盜夸"
  base: "夸"
  witnesses: { mawangdui-a: "竽", mawangdui-b: "竽", hanfeizi: "竽" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    夸 is swagger; 竽 is the great reed mouth-organ that led the ancient
    ensemble. 盜竽 makes the gleaming ruler not merely a loud thief but the
    ringleader whose tune the rest play along to. Han Feizi reads it so.
  logged: notes/manuscript.md

- chapter: 55
  line: "未知牝牡之合而全作"
  base: "全"
  witnesses: { mawangdui-a: "朘", fuyi: "朘" }
  meaning_bearing: true
  our_call: base
  note: >
    朘 is specifically the infant boy's member. We keep our base text's 全
    (whole) in its plain sense, which preserves the point about desireless
    potency while keeping the emblem available to infants of every gender.
  logged: notes/manuscript.md

- chapter: 61
  line: "大國者下流 … (國 ×7)"
  base: "國"
  witnesses: { mawangdui-a: "邦", mawangdui-b: "邦" }
  meaning_bearing: false
  our_call: base
  note: >
    The systematic Han name-taboo avoiding the personal name of the founding
    emperor Liu Bang (劉邦). Meaning-neutral, logged once rather than at each
    of the seven occurrences.
  logged: notes/manuscript.md

- chapter: 61
  line: "小國以下大國，則取大國"
  base: "則取大國"
  witnesses: { }
  meaning_bearing: true
  our_call: base
  note: >
    Not a witness fork but an editorial one: some editions supply 於 (取於大國)
    to license a passive reading. We keep the active in both halves, since the
    chiastic repetition is the argument. Heshang Gong reads it actively too.
  logged: notes/manuscript.md

- chapter: 63
  line: "大小多少，報怨以德"
  base: "報怨以德"
  witnesses: { mawangdui-a: "報怨以德" }
  meaning_bearing: false
  our_call: base
  note: >
    Not a fork but an attestation, and it settles a long-standing suspicion.
    The line is routinely treated as a stray from Ch 79 (和大怨) that migrated
    here. Mawangdui A has it in this chapter, immediately after 大小多少, so it
    is original to Ch 63 and the collision with Analects 14.34 is the text's
    own.
  logged: notes/manuscript.md

- chapter: 63
  line: "夫輕諾必寡信"
  base: "輕諾必寡信"
  witnesses: { mawangdui-b: "damaged — two graphs illegible in the 輕…信 span" }
  meaning_bearing: false
  our_call: base
  note: >
    Both silks are damaged through this line and B preserves only part of it,
    so the 信 → trust lock rests here on the received text alone. Recorded as
    the fact of the damage, not as anyone's reconstruction of the lost graphs.
  logged: notes/manuscript.md

- chapter: 62
  line: "美言可以市尊，美行可以加人"
  base: "市尊，美行"
  witnesses: { wangbi: "市 | 尊行", heshanggong: "市 | 尊行" }
  meaning_bearing: true
  our_call: heshanggong
  note: >
    A punctuation fork that is also a character fork. Our base splits after 尊
    and reads 美行 (fine conduct), giving a 美/美 parallel. Both classical
    commentators split after 市 and read 尊行 (honored conduct): Heshang Gong's
    lemmas are printed separately as 美言可以市 and 尊行可以加人, and Wang Bi's
    comment does the same (故曰美言可以市也 … 故曰可以加於人也). We follow the
    commentators; 市 becomes a plain verb, "to be traded in the market."
  logged: notes/manuscript.md

- chapter: 62
  line: "道者萬物之奧"
  base: "奧"
  witnesses: { mawangdui-a: "注", mawangdui-b: "注" }
  meaning_bearing: true
  our_call: base
  note: >
    The chapter's opening word, and the oldest witnesses do not have it. Gao
    Ming's Boshu Laozi Jiaozhu reads the silks' 注 as a loan for 主 (zhu —
    master), giving "the Tao is the master of the countless things", and cites
    Zheng Xuan on Liji Liyun (奧猶主也) and Zuozhuan Zhao 13 (國有奧主) to show
    that 奧 itself bore that sense. We keep 奧 and decline the mastery reading,
    because Ch 34 denies it twice in the identical words — 衣養萬物而不為主 and
    萬物歸焉而不為主. Both of the silks' available senses (注 as "pour into",
    or 主 by way of 奧's own "one who presides at the corner") run through a
    place, and the place is the older layer of the word. See notes/translation.md.
  logged: notes/manuscript.md

- chapter: 62
  line: "故立天子，置三公"
  base: "三公"
  witnesses: { mawangdui-a: "三鄉 (read by editors as 三卿)", mawangdui-b: "三鄉 (read by editors as 三卿)" }
  meaning_bearing: false
  our_call: base
  note: >
    The silks write 鄉, which editors read as a loan for 卿 (qing — high
    minister). Not meaning-bearing, and logged because it settles an English
    question: 公 is conventionally rendered "duke", but the oldest witness names
    the office with the word that means minister. Our "the three ministers"
    is the older reading's own word. The same line confirms 天子 stands in the
    silks — the title is not a later accretion.
  logged: notes/manuscript.md

- chapter: 62
  line: "善人之寶，不善人之所保"
  base: "寶 … 保"
  witnesses: { mawangdui-a: "one graph used in both positions", mawangdui-b: "one graph used in both positions", dunhuang: "所不保" }
  meaning_bearing: true
  our_call: base
  note: >
    Two separate forks. (1) Where our base uses two different graphs, 寶
    (treasure) then 保 (keep safe), the silks use the same graph twice —
    published transcriptions differ on which, and that disagreement is itself
    modern editorial work. So the received text's pair may be a later
    differentiation of one word. (2) Dunhuang manuscripts, Yan Zun and Zhao
    Zhijian read 不善人之所不保 — with a negation, reversing the clause. Yan
    Kejun reports all editions reading 所保. We keep the base text; the
    negation would make the Tao what the unmasterful fail to keep, which
    contradicts the chapter's 何棄之有.
  logged: notes/manuscript.md

